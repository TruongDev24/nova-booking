name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            nova-booking-backend/package-lock.json

      # --- Backend Audit & Build Check ---
      - name: Backend - Install dependencies
        working-directory: ./nova-booking-backend
        run: npm ci

      - name: Backend - Lint
        working-directory: ./nova-booking-backend
        run: npm run lint

      - name: Backend - Build test
        working-directory: ./nova-booking-backend
        run: npm run build

      # --- Frontend Audit & Build Check ---
      - name: Frontend - Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend - Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Frontend - Build test
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.placeholder.com
        run: npm run build

  docker-build-check:
    needs: audit-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image (Verify Dockerfile.prod)
        uses: docker/build-push-action@v5
        with:
          context: ./nova-booking-backend
          file: ./nova-booking-backend/Dockerfile.prod
          push: false
          tags: nova-backend:latest

      - name: Build Frontend Image (Verify Dockerfile.prod)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: false
          tags: nova-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.placeholder.com

  deploy:
    needs: docker-build-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Instructions
        run: |
          echo "CI checks passed! Project is ready for production."
          echo "For 100% Free Tier Deployment:"
          echo "1. Frontend: Connect this repo to Vercel (Auto-deploys on push to main)."
          echo "2. Backend: Connect this repo to Render (Use Dockerfile.prod, auto-deploys on push to main)."
          echo "3. DB: Supabase PostgreSQL."
          echo "4. Redis: Upstash Serverless Redis."
