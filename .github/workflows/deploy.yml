name: NOVA Booking CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 🔍 Giai đoạn 1: Kiểm tra chất lượng mã nguồn
  audit-and-test:
    name: 🧪 Audit & Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            nova-booking-backend/package-lock.json

      # --- Kiểm tra Backend ---
      - name: Backend - Install & Lint
        working-directory: ./nova-booking-backend
        run: |
          npm ci
          npx prisma generate
          npm run lint

      - name: Backend - Build Check
        working-directory: ./nova-booking-backend
        run: npm run build

      # --- Kiểm tra Frontend ---
      - name: Frontend - Install & Lint
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint

      - name: Frontend - Build Check
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.placeholder.com
        run: npm run build

  # 🚀 Giai đoạn 2: Tự động Deploy
  deploy:
    name: 🚢 Deployment
    needs: audit-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # 1. Trigger Render cho Backend
      - name: 🚀 Trigger Render Backend Deploy
        run: |
          if [ -z "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" ]; then
            echo "❌ Error: RENDER_BACKEND_DEPLOY_HOOK is not set in GitHub Secrets!"
            exit 1
          fi
          curl -f -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
          echo "✅ Render deployment triggered successfully!"

      # 2. Thông báo trạng thái (Vercel tự động nhận diện push nên không cần trigger tay)
      - name: 🔔 Deployment Summary
        run: |
          echo "========================================================="
          echo "🚀 CI/CD Pipeline Completed Successfully!"
          echo "🔹 Backend: Deployment triggered on Render."
          echo "🔹 Frontend: Vercel is automatically building your push."
          echo "========================================================="
