services:
  db:
    image: postgres:15-alpine
    container_name: nova-postgres
    env_file:
      - ./nova-booking-backend/.env
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - PGTZ=Asia/Ho_Chi_Minh
    ports:
      - "5435:5432"
    volumes:
      - nova_pg_data:/var/lib/postgresql/data
    networks:
      - nova-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d nova_booking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nova-redis
    ports:
      - "6379:6379"
    networks:
      - nova-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./nova-booking-backend
      dockerfile: Dockerfile
    container_name: nova-backend
    env_file:
      - ./nova-booking-backend/.env
    ports:
      - "3001:3001"
    volumes:
      - ./nova-booking-backend:/app
      - /app/node_modules
    environment:
      - DATABASE_URL=postgresql://root:rootpassword@db:5432/nova_booking_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TZ=Asia/Ho_Chi_Minh
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nova-network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/api || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nova-frontend
    env_file:
      - ./frontend/.env.local
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      # Nếu Next.js có chạy SSR (Server Side Rendering), dùng 'backend' thay vì 'localhost'
      - NEXT_PUBLIC_API_URL=http://localhost:3001
      - BACKEND_INTERNAL_URL=http://backend:3001
    depends_on:
      backend:
        condition: service_healthy # Đảm bảo backend sẵn sàng trước khi start frontend
    networks:
      - nova-network
    restart: always

networks:
  nova-network:
    driver: bridge

volumes:
  nova_pg_data: